<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Sertifikat Training</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--card:#ffffff;--line:#e8e3d4;--gold:#c99a2e;--gold2:#7a5c10;--tx:#1b2240;--mut:#6b7390}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#f3e6bd 0,transparent 60%),radial-gradient(800px 400px at -10% 10%,#e6ebfa 0,transparent 60%),var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px}
h1{font-family:Cinzel,serif;font-size:clamp(26px,4vw,40px);margin:0;letter-spacing:.06em;background:linear-gradient(90deg,#1b2650,#c99a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:8px 0 28px}
.bar{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:12px 16px;border-radius:12px;min-width:280px;font:inherit;outline:none}
.search:focus{border-color:var(--gold)}
.info{color:var(--mut);font-size:14px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(60,50,20,.10)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-family:Cinzel,serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--gold2);padding:16px;border-bottom:1px solid var(--gold);background:#fbf8ee;position:sticky;top:0}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
tr:hover td{background:#fbf6e6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.btn{background:linear-gradient(135deg,#edcf70,#c99a2e);color:#2a2108;border:0;padding:8px 16px;border-radius:999px;font:600 13px Inter;cursor:pointer;white-space:nowrap;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(201,154,46,.4)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.pg{display:flex;gap:6px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.pg button{background:var(--card);border:1px solid var(--line);color:var(--tx);min-width:40px;height:40px;border-radius:10px;cursor:pointer;font:inherit}
.pg button.on{background:var(--gold);color:#2a2108;border-color:var(--gold);font-weight:600}
.pg button:disabled{opacity:.35;cursor:default}
.msg{padding:40px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.open{display:flex}
.box{max-width:1000px;width:100%;background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:18px}
.box canvas{width:100%;height:auto;border-radius:8px;display:block}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>PORTAL SERTIFIKAT</h1>
  <p class="sub">Daftar peserta training — klik tombol untuk membuat sertifikat secara otomatis.</p>
  <div class="bar">
    <input id="q" class="search" placeholder="Cari nama, unit, NPP, atau nama training…">
    <span class="info" id="info"></span>
  </div>
  <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="msg" id="msg">Memuat data…</div></div>
  <div class="pg" id="pg"></div>
</div>

<div class="modal" id="modal"><div class="box">
  <canvas id="cv" width="1754" height="1240"></canvas>
  <div class="acts">
    <button class="btn ghost" id="close">Tutup</button>
    <button class="btn" id="dlpng">Unduh PNG</button>
    <button class="btn" id="dlpdf">Unduh PDF</button>
  </div>
</div></div>

<script>
// ====== KONFIGURASI ======
const SHEET_ID = "1aNNK8_nqyrd0-4lX_eQjI1_txsrym7EZ4jKNvQEJbRM";
const GID = "1";
const SHEET_NAME = "peserta";   // isi nama tab, contoh: "peserta" (jika diisi, GID diabaikan)
const PER_PAGE = 50;
const MAX_COLS = 7;   // hanya tampilkan kolom 1–7 (kolom 8 dst. disembunyikan)
const ORG = "PT SWADHARMA SARANA INFORMATIKA";
// =========================

const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
const THEMES=[
 {b:["#0a1230","#142251","#080e26"],g:["#f3dc8f","#c99a2e"],r:"212,175,55"},
 {b:["#04201a","#0b3d31","#03150f"],g:["#f3dc8f","#c99a2e"],r:"212,175,55"},
 {b:["#2a0a14","#4d1426","#1c050d"],g:["#f3dc8f","#c99a2e"],r:"212,175,55"},
 {b:["#190b33","#2e1860","#10061f"],g:["#f1f1f8","#a9acc4"],r:"190,190,215"},
 {b:["#04242b","#0a4552","#031a1f"],g:["#f8d3c0","#d79a7c"],r:"230,170,140"},
 {b:["#1a1a1a","#333333","#0d0d0d"],g:["#f2c9a0","#c0763a"],r:"200,130,70"},
 {b:["#07182e","#0f3a63","#050f1e"],g:["#bfe9ff","#6fb4dc"],r:"130,190,230"},
 {b:["#1b2410","#34471e","#10160a"],g:["#efe3b0","#b9a54a"],r:"200,185,90"},
 {b:["#2b0a2a","#561a52","#1b061a"],g:["#f3dc8f","#c99a2e"],r:"212,175,55"},
 {b:["#2a1a0a","#4d3217","#1b1006"],g:["#f3dc8f","#c99a2e"],r:"212,175,55"}
];
let tmap={};
const themeOf=t=>THEMES[(tmap[t]||0)%THEMES.length];
let head = [], rows = [], view = [], page = 1, idx = {}, cur = null;
const $ = id => document.getElementById(id);

function parseCSV(t){
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);out.push(r);r=[];c=""}
    else if(ch!='\r') c+=ch;
  }
  if(c||r.length){r.push(c);out.push(r)}
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function detect(){
  const f = re => head.findIndex(h=>re.test(h.toLowerCase()));
  idx.train = f(/training|pelatihan|diklat|kegiatan/);
  idx.npp = f(/npp|nip|nik/);
  idx.unit = f(/unit|divisi|bagian|departemen|cabang|satker/);
  idx.date = f(/tanggal|tgl|date|waktu/);
  idx.name = head.findIndex((h,i)=>/nama/.test(h.toLowerCase()) && i!==idx.train);
  if(idx.name<0) idx.name=0;
}

function fetchSheet(){
  // JSONP (script tag): tidak kena blokir CORS, jadi aman dibuka dari file lokal maupun hosting
  return new Promise((ok,fail)=>{
    const cb="__sheet"+Date.now(), sc=document.createElement("script");
    const t=setTimeout(()=>{sc.remove();fail(new Error("timeout / sheet tidak publik"))},15000);
    window[cb]=d=>{clearTimeout(t);sc.remove();delete window[cb];d.status==="error"?fail(new Error(d.errors?.[0]?.detailed_message||"error")):ok(d.table)};
    sc.onerror=()=>{clearTimeout(t);fail(new Error("gagal mengakses Google Sheets"))};
    const tab = SHEET_NAME ? "sheet="+encodeURIComponent(SHEET_NAME) : "gid="+GID;
    sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${tab}&tqx=out:json;responseHandler:${cb}`;
    document.head.appendChild(sc);
  });
}

async function load(){
  try{
    const t = await fetchSheet();
    const cell = c => c==null ? "" : (c.f ?? c.v ?? "");
    let data = t.rows.map(r=>(r.c||[]).map(cell));
    let labels = t.cols.map(c=>(c.label||"").trim());
    if(labels.every(l=>!l)){ labels = data.shift().map(String); }
    head = labels.map((l,i)=>l||("Kolom "+(i+1)));
    rows = data.filter(r=>r.some(x=>String(x).trim()));
    rows.forEach(r=>{while(r.length<head.length) r.push("")});
    detect(); view = rows;
    tmap={}; rows.forEach(r=>{const t=idx.train>=0?r[idx.train]:""; if(!(t in tmap)) tmap[t]=Object.keys(tmap).length});
    $("thead").innerHTML = "<tr><th>No</th>"+head.slice(0,MAX_COLS).map(h=>`<th>${esc(h)}</th>`).join("")+"<th>Sertifikat</th></tr>";
    $("msg").style.display="none"; render();
  }catch(e){
    $("msg").innerHTML = "Gagal memuat data ("+esc(e.message)+").<br>Pastikan spreadsheet: <b>Share → Anyone with the link → Viewer</b>, dan nomor <code>gid</code> tab benar.";
  }
}

function render(){
  const total = Math.max(1,Math.ceil(view.length/PER_PAGE));
  page = Math.min(page,total);
  const s=(page-1)*PER_PAGE, part=view.slice(s,s+PER_PAGE);
  $("tbody").innerHTML = part.map((r,i)=>
    `<tr><td>${s+i+1}</td>${head.slice(0,MAX_COLS).map((_,k)=>`<td>${k===idx.train?`<i class="dot" style="background:${themeOf(r[k]).g[1]}"></i>`:""}${esc(r[k]??"")}</td>`).join("")}<td><button class="btn" data-i="${rows.indexOf(r)}">Link Sertifikat</button></td></tr>`).join("");
  $("info").textContent = view.length ? `Menampilkan ${s+1}–${s+part.length} dari ${view.length} data` : "Tidak ada data";
  const b=[]; const add=(l,p,d,on)=>b.push(`<button ${d?"disabled":""} class="${on?"on":""}" data-p="${p}">${l}</button>`);
  add("‹",page-1,page==1);
  for(let p=1;p<=total;p++) if(p==1||p==total||Math.abs(p-page)<=2) add(p,p,false,p==page); else if(Math.abs(p-page)==3) b.push("<span style='color:var(--mut);align-self:center'>…</span>");
  add("›",page+1,page==total);
  $("pg").innerHTML=b.join("");
}

$("pg").onclick = e=>{const p=e.target.dataset.p; if(p){page=+p;render();scrollTo({top:0,behavior:"smooth"})}};
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const hay=r=>norm([...r.slice(0,MAX_COLS),r[idx.name],r[idx.unit],r[idx.train],r[idx.npp]].filter(Boolean).join(" "));
$("q").oninput = e=>{
  const ks=norm(e.target.value).split(/\s+/).filter(Boolean);   // tiap kata harus cocok (sebagian kata pun boleh)
  view = ks.length ? rows.filter(r=>{const h=hay(r);return ks.every(k=>h.includes(k))}) : rows;
  page=1; render();
};
$("tbody").onclick = e=>{const i=e.target.dataset.i; if(i!==undefined) openCert(rows[+i])};
$("close").onclick = ()=>$("modal").classList.remove("open");
$("modal").onclick = e=>{if(e.target.id==="modal") $("modal").classList.remove("open")};

// tanda tangan transparan: goresan gelap diubah jadi krem agar terbaca di latar gelap (merah tetap merah)
let TTD_LIGHT=null;
function tint(img){
  const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;
  const q=c.getContext("2d");q.drawImage(img,0,0);
  const d=q.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){ if(p[i+3]&&p[i]-Math.max(p[i+1],p[i+2])<60){p[i]=246;p[i+1]=238;p[i+2]=210} }
  q.putImageData(d,0,0);return c;
}
function plate(x,px,py,w,h,gold){
  const r=22;x.save();x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();
  const g=x.createLinearGradient(px,py,px,py+h);g.addColorStop(0,"#fffefa");g.addColorStop(1,"#f3ead2");
  x.shadowColor="rgba(0,0,0,.35)";x.shadowBlur=18;x.shadowOffsetY=6;x.fillStyle=g;x.fill();
  x.shadowColor="transparent";if(gold){x.strokeStyle=gold;x.lineWidth=3;x.stroke()}x.restore();
}
async function openCert(r){
  cur = {name:r[idx.name]||"-", npp:idx.npp>=0?r[idx.npp]:"", date:idx.date>=0?r[idx.date]:"", train:idx.train>=0?r[idx.train]:""};
  await Promise.all(["700 20px Cinzel","64px 'Great Vibes'","500 20px 'Cormorant Garamond'","italic 500 20px 'Cormorant Garamond'"].map(f=>document.fonts.load(f)));
  await Promise.all(Object.values(IMG).map(i=>i.decode().catch(()=>{})));
  TTD_LIGHT=TTD_LIGHT||tint(IMG.ttd);
  draw(); $("modal").classList.add("open");
}

function draw(){
  const c=$("cv"),x=c.getContext("2d"),W=c.width,H=c.height,T=themeOf(cur.train);
  // latar
  let g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,T.b[0]); g.addColorStop(.5,T.b[1]); g.addColorStop(1,T.b[2]);
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // pola guilloche halus
  x.save(); x.strokeStyle=`rgba(${T.r},.07)`; x.lineWidth=1.2;
  for(let i=0;i<40;i++){x.beginPath();x.ellipse(W/2,H/2,120+i*22,60+i*14,0,0,Math.PI*2);x.stroke()}
  x.restore();
  // glow tengah
  g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,H*.8); g.addColorStop(0,"rgba(255,255,255,.07)"); g.addColorStop(1,"transparent");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  // bingkai emas
  const gold=x.createLinearGradient(0,0,W,0); gold.addColorStop(0,T.g[0]); gold.addColorStop(.5,T.g[1]); gold.addColorStop(1,T.g[0]);
  x.strokeStyle=gold; x.lineWidth=10; x.strokeRect(40,40,W-80,H-80);
  x.lineWidth=2; x.strokeRect(68,68,W-136,H-136);
  x.lineWidth=1; x.strokeRect(80,80,W-160,H-160);
  // ornamen sudut
  [[80,80,1,1],[W-80,80,-1,1],[80,H-80,1,-1],[W-80,H-80,-1,-1]].forEach(([px,py,sx,sy])=>{
    x.save();x.translate(px,py);x.scale(sx,sy);x.fillStyle=gold;
    x.beginPath();x.moveTo(0,0);x.lineTo(90,0);x.lineTo(0,90);x.closePath();x.globalAlpha=.9;x.fill();
    x.globalAlpha=1;x.strokeStyle=T.b[0];x.lineWidth=2;x.beginPath();x.moveTo(0,40);x.lineTo(40,0);x.stroke();x.restore();
  });
  x.textAlign="center"; x.fillStyle=gold;
  x.font="700 26px Cinzel"; x.fillText(ORG.toUpperCase(),W/2,170);
  x.font="700 92px Cinzel"; x.fillText("SERTIFIKAT",W/2,290);
  x.font="italic 500 34px 'Cormorant Garamond'"; x.fillStyle="#e8d9a8"; x.fillText("Penghargaan Penyelesaian Pelatihan",W/2,345);
  // garis pemisah
  x.fillStyle=gold; x.fillRect(W/2-180,375,360,3); 
  x.fillStyle="#cfd6ee"; x.font="500 28px 'Cormorant Garamond'"; x.fillText("Dengan bangga diberikan kepada",W/2,450);
  // nama (auto-shrink)
  let fs=120; x.font=`${fs}px 'Great Vibes'`;
  while(x.measureText(cur.name).width>W-420 && fs>50){fs-=4;x.font=`${fs}px 'Great Vibes'`}
  x.fillStyle=gold; x.fillText(cur.name,W/2,590);
  x.fillRect(W/2-330,620,660,2);
  x.fillStyle="#cfd6ee"; x.font="600 28px 'Cormorant Garamond'"; x.fillText(cur.npp?`NPP : ${cur.npp}`:"",W/2,670);
  x.font="500 28px 'Cormorant Garamond'"; x.fillText("atas partisipasi dan keberhasilannya dalam mengikuti pelatihan",W/2,730);
  let tf=54; x.font=`700 ${tf}px Cinzel`;
  while(x.measureText(cur.train).width>W-360 && tf>26){tf-=2;x.font=`700 ${tf}px Cinzel`}
  x.fillStyle=T.g[0]; x.fillText(cur.train.toUpperCase(),W/2,810);
  x.fillStyle="#cfd6ee"; x.font="italic 500 30px 'Cormorant Garamond'"; x.fillText(cur.date?`yang dilaksanakan pada ${cur.date}`:"",W/2,870);
  // logo kiri atas
  plate(x,190,110,236,160,null);
  x.drawImage(IMG.logo,190+18,110+16,200,133.3);
  // tanda tangan (tengah)
  x.drawImage(TTD_LIGHT||IMG.ttd,W/2-175,900,350,160.9);
  x.textAlign="center";
  x.fillStyle=gold; x.fillRect(W/2-190,1088,380,2);
  x.fillStyle=T.g[0]; x.font="700 28px Cinzel"; x.fillText("General Manager HCC",W/2,1130);
}

const fname = ()=>`Sertifikat_${cur.name.replace(/[^\w]+/g,"_")}`;
$("dlpng").onclick = ()=>{const a=document.createElement("a");a.href=$("cv").toDataURL("image/png");a.download=fname()+".png";a.click()};
$("dlpdf").onclick = ()=>{
  const {jsPDF}=window.jspdf; const d=new jsPDF({orientation:"landscape",unit:"px",format:[1754,1240]});
  d.addImage($("cv").toDataURL("image/jpeg",.95),"JPEG",0,0,1754,1240); d.save(fname()+".pdf");
};
