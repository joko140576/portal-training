<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Training CRM — Batch 1, 2 &amp; Kaset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080716; --ink:#f6f4ff; --muted:#b9b5dc; --line:rgba(255,255,255,.14);
  --violet:#8b5cf6; --pink:#f472b6; --teal:#2dd4bf; --amber:#fbbf24; --blue:#60a5fa;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- Background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
   radial-gradient(1200px 700px at 15% -10%,#2b1a5e 0%,transparent 60%),
   radial-gradient(900px 700px at 100% 20%,#4a1550 0%,transparent 55%),
   radial-gradient(1000px 800px at 0% 100%,#0b3b4a 0%,transparent 55%),
   linear-gradient(160deg,#0a0820,#0d0a24 50%,#07101f)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.b1{width:560px;height:560px;background:var(--violet);top:-160px;left:-120px}
.b2{width:480px;height:480px;background:var(--pink);top:18%;right:-140px;animation-duration:32s;opacity:.38}
.b3{width:520px;height:520px;background:var(--teal);bottom:-180px;left:8%;animation-duration:29s;opacity:.34}
.b4{width:340px;height:340px;background:var(--amber);bottom:12%;right:6%;animation-duration:36s;opacity:.22}
@keyframes drift{to{transform:translate3d(60px,-50px,0) scale(1.15)}}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grid-lines{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}

/* ---------- Nav ---------- */
.nav{position:sticky;top:12px;z-index:40;width:min(1240px,calc(100vw - 24px));margin:12px auto 0;
  display:flex;align-items:center;gap:8px;padding:10px 14px 10px 22px;border-radius:999px;
  background:rgba(18,14,44,.55);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 10px 40px -12px rgba(0,0,0,.6)}
.logo{font-family:var(--serif);font-weight:600;font-size:1.2rem;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;padding:9px 16px;border-radius:999px;transition:.25s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.92rem;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s;white-space:nowrap}
.btn.primary{background:linear-gradient(120deg,var(--violet),var(--pink) 60%,var(--amber));background-size:160% 100%;color:#fff;
  box-shadow:0 10px 30px -8px rgba(244,114,182,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 16px 38px -8px rgba(244,114,182,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.14)}

/* ---------- Hero ---------- */
.hero{width:min(1240px,calc(100vw - 40px));margin:0 auto;padding:clamp(56px,9vw,120px) 0 clamp(30px,5vw,60px);text-align:center;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,7.4vw,6rem);line-height:1.02;letter-spacing:-.02em;margin:26px auto 0;max-width:15ch}
.hero h1 em{font-style:italic;font-weight:400;background:linear-gradient(100deg,var(--blue),var(--violet) 30%,var(--pink) 60%,var(--amber));background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:220% 0}}
.hero p{max-width:560px;margin:24px auto 0;color:var(--muted);line-height:1.7;font-size:1.02rem}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:44px}
.stat{min-width:170px;padding:16px 22px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid var(--line);backdrop-filter:blur(10px);text-align:left}
.stat small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.stat strong{font-family:var(--serif);font-size:1.9rem;font-weight:600}
.stat strong span{font-size:1rem;color:var(--muted);font-weight:400}

/* ---------- Session ---------- */
main{padding-bottom:40px}
.session{width:min(1240px,calc(100vw - 40px));margin:0 auto;padding-top:clamp(50px,7vw,90px);scroll-margin-top:60px}
.s1{--a:var(--violet);--b:var(--pink)}
.s2{--a:var(--teal);--b:var(--amber)}
.s3{--a:var(--blue);--b:var(--amber)}
.s4{--a:var(--pink);--b:var(--teal)}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 30px;margin-bottom:46px}
.big{font-family:var(--serif);font-weight:700;font-size:clamp(4.5rem,11vw,9rem);line-height:.8;color:transparent;
  background:linear-gradient(180deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;
  opacity:.9;filter:drop-shadow(0 8px 30px color-mix(in srgb,var(--b) 40%,transparent))}
.ttlwrap{flex:1;min-width:260px}
.kicker{font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;color:var(--b);font-weight:700}
.ttl{font-family:var(--serif);font-weight:600;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1.1;margin-top:8px}
.per{margin-top:8px;color:var(--muted);font-size:1.02rem}
.cnt{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.85rem;color:var(--muted);white-space:nowrap}
.cnt b{color:#fff}
.note{width:100%;margin:-24px 0 26px;padding:12px 16px;border-radius:14px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.45);font-size:.85rem;line-height:1.6;color:#ffd5dc}

/* ---------- Collage ---------- */
.collage{--gap:22px;--W:min(1240px,100vw - 40px);--u:calc((var(--W) - 11 * var(--gap)) / 12);
  width:var(--W);margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:calc(var(--u) * .95);gap:var(--gap);padding-bottom:26px}
.slot{position:relative;grid-column:var(--gc);grid-row:var(--gr);border-radius:6px;
  opacity:0;transform:rotate(var(--rot)) translate(var(--tx),calc(var(--ty) + 36px)) scale(.97);
  transition:opacity .8s ease var(--d),transform .9s cubic-bezier(.2,.8,.2,1) var(--d),box-shadow .4s;z-index:1}
.slot.in{opacity:1;transform:rotate(var(--rot)) translate(var(--tx),var(--ty))}
.slot.in.filled:hover{transform:rotate(0) translate(0,-8px) scale(1.035);z-index:6;transition-delay:0s,0s,0s}
.in-box{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
/* empty / loading */
.slot:not(.filled){border-radius:20px}
.slot:not(.filled) .in-box{border-radius:20px;border:1.5px dashed rgba(255,255,255,.25);
  background:linear-gradient(110deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.05) 70%);background-size:220% 100%;animation:sk 1.6s linear infinite;
  display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;padding:10px}
.slot.empty .in-box{animation:none;background:rgba(255,255,255,.04)}
@keyframes sk{to{background-position:-220% 0}}
/* filled */
.slot.filled{background:#f8f5ff;box-shadow:0 0 0 6px #f8f5ff,0 34px 60px -24px rgba(0,0,0,.85),0 12px 30px -12px rgba(0,0,0,.6);cursor:zoom-in}
.slot.filled:hover{box-shadow:0 0 0 6px #fff,0 50px 80px -26px rgba(0,0,0,.9),0 0 60px -10px var(--b)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1);user-select:none;animation:fade .7s}
.slot.filled:hover img{transform:scale(1.07)}
.slot.filled .in-box::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,6,24,.65),transparent 45%);opacity:0;transition:.4s;pointer-events:none}
.slot.filled:hover .in-box::after{opacity:1}
.num{position:absolute;left:12px;bottom:12px;z-index:3;padding:5px 12px;border-radius:99px;font-size:.74rem;font-weight:700;letter-spacing:.06em;
  background:rgba(10,8,30,.55);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.22);opacity:0;transform:translateY(8px);transition:.35s;pointer-events:none}
.slot:hover .num{opacity:1;transform:none}
@media (hover:none){.num{opacity:1;transform:none}}

/* ---------- Footer ---------- */
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:60px 20px 50px;line-height:1.8}
footer .logo{display:block;margin:0 0 6px;font-size:1.4rem;color:#fff}

/* ---------- Lightbox ---------- */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
.lb{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(4,3,14,.94);backdrop-filter:blur(14px);animation:fade .25s}
.lb[hidden]{display:none!important}
.lb img{max-width:min(94vw,1500px);max-height:80vh;border-radius:8px;box-shadow:0 40px 120px -20px #000,0 0 0 8px rgba(255,255,255,.95);animation:rise .4s cubic-bezier(.2,.8,.2,1);object-fit:contain}
.lb .cap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;color:var(--muted);font-size:.9rem;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.lb .cap b{color:#fff;font-family:var(--serif);font-size:1.1rem;font-weight:600;margin-right:8px}
.lb .nv{position:absolute;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;transform:translateY(-50%);transition:.25s;border:1px solid var(--line)}
.lb .nv:hover{background:linear-gradient(135deg,var(--violet),var(--pink))}
.lb svg{width:22px;height:22px;stroke:#fff}
.lb .prev{left:20px}.lb .next{right:20px}
.lb .top{position:absolute;top:18px;right:18px;display:flex;gap:10px}
.lb .tb{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;transition:.25s;border:1px solid var(--line);text-decoration:none}
.lb .tb:hover{background:rgba(255,255,255,.22)}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .nav a{padding:9px 10px;font-size:.82rem}
  .collage{--gap:20px;grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;padding:0 6px 20px}
  .slot{grid-column:auto;grid-row:auto;transform:rotate(var(--rot)) translateY(30px)}
  .slot.in{transform:rotate(var(--rot))}
  .slot.in.filled:hover{transform:rotate(0) scale(1.02)}
  .slot.l{grid-column:span 2;aspect-ratio:3/2}
  .slot.p{aspect-ratio:3/4}
  .lb .nv{width:42px;height:42px}.lb .prev{left:8px}.lb .next{right:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grid-lines"></div><div class="grain"></div>
</div>

<header class="nav">
  <div class="logo">Momen<i>.</i>CRM</div>
  <span id="navLinks" style="display:contents"></span>
</header>

<section class="hero">
  <span class="eyebrow"><b></b> Galeri Dokumentasi</span>
  <h1>Kenangan <em>Training CRM</em> dalam bingkai</h1>
  <p>Kumpulan momen belajar, diskusi, dan kebersamaan peserta — ditata bebas dalam kolase potret &amp; lanskap.</p>
  <div class="cta" id="cta"></div>
  <div class="stats" id="stats"></div>
</section>

<main id="main"></main>

<footer>
  <div class="logo">Momen<i style="font-style:normal;color:#f472b6">.</i>CRM</div>
  Dokumentasi Training CRM · Batch 1, Batch 2 &amp; Kaset CRM
</footer>

<!-- Lightbox -->
<div class="lb" id="lb" hidden>
  <div class="top">
    <a class="tb" id="lbDl" title="Unduh foto"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></a>
    <button class="tb" id="lbClose" title="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <button class="nv prev" id="lbPrev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <img id="lbImg" alt="">
  <button class="nv next" id="lbNext" aria-label="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   DAFTAR FOTO — ubah nama file di sini bila perlu.
   Letakkan semua file foto di FOLDER YANG SAMA dengan file HTML ini.
   label = nama pendek untuk navigasi & statistik.
   ===================================================================== */
const SESSIONS = [
  {
    id:1, cls:'s1', label:'Batch 1',
    title:'Training Batch 1 - CRM',
    period:'Jan – Feb 2024',
    images:[
      'foto1.jpeg','foto2.jpeg','foto3.jpeg','foto4.jpeg','foto5.jpeg',
      'foto6.jpeg','foto7.jpeg','foto8.jpeg','foto9.jpeg','foto10.jpeg'
    ]
  },
  {
    id:2, cls:'s2', label:'Batch 2',
    title:'Training Batch 2 - CRM',
    period:'Mar – Apr 2024',
    images:[
      'foto11.jpeg','foto12.jpeg','foto13.jpeg','foto14.jpeg','foto15.jpeg',
      'foto16.jpeg','foto17.jpeg','foto18.jpeg','foto19.jpeg'
    ]
  },
  {
    id:3, cls:'s3', label:'Kaset',
    title:'Training Kaset - CRM',
    period:'Oktober 2026',
    images:[
      'foto20.jpeg','foto21.jpeg','foto22.jpeg','foto23.jpeg','foto25.jpeg',
      'foto26.jpeg','foto27.jpeg','foto28.jpeg','foto29.jpeg','foto30.jpeg'
    ]
  },
  {
    id:4, cls:'s4', label:'Sesi 4',
    title:'Training Sesi 4 - CRM',
    period:'Periode menyusul',
    images:[
      'foto31.jpeg','foto32.jpeg','foto33.jpeg','foto34.jpeg','foto35.jpeg',
      'foto36.jpeg','foto37.jpeg','foto38.jpeg','foto39.jpeg','foto40.jpeg'
    ]
  }
];

/* Tata letak kolase (grid 12 kolom). t: 'p' = bingkai potret, 'l' = bingkai lanskap.
   Foto potret otomatis masuk bingkai potret, foto lanskap ke bingkai lanskap. */
const LAYOUT_10 = [
  {t:'l', gc:'1/7',  gr:'1/6',  rot:-1.2, tx:0, ty:0},
  {t:'p', gc:'7/10', gr:'1/6',  rot:1.4,  tx:0, ty:14},
  {t:'p', gc:'10/13',gr:'1/6',  rot:-0.9, tx:0, ty:-8},
  {t:'p', gc:'1/4',  gr:'6/10', rot:1,    tx:0, ty:6},
  {t:'l', gc:'4/10', gr:'6/10', rot:-0.6, tx:0, ty:0},
  {t:'p', gc:'10/13',gr:'6/11', rot:1.2,  tx:0, ty:10},
  {t:'l', gc:'4/8',  gr:'10/13',rot:0.9,  tx:0, ty:4},
  {t:'p', gc:'8/10', gr:'10/13',rot:-1.4, tx:0, ty:-4},
  {t:'l', gc:'1/4',  gr:'10/13',rot:-1,   tx:0, ty:8},
  {t:'l', gc:'10/13',gr:'11/13',rot:0.8,  tx:0, ty:6}
];
const LAYOUT_9 = [
  {t:'l', gc:'1/7',  gr:'1/6',  rot:-1.2, tx:0, ty:0},
  {t:'p', gc:'7/10', gr:'1/6',  rot:1.4,  tx:0, ty:14},
  {t:'p', gc:'10/13',gr:'1/6',  rot:-0.9, tx:0, ty:-8},
  {t:'p', gc:'1/4',  gr:'6/10', rot:1,    tx:0, ty:6},
  {t:'l', gc:'4/10', gr:'6/10', rot:-0.6, tx:0, ty:0},
  {t:'p', gc:'10/13',gr:'6/10', rot:1.2,  tx:0, ty:10},
  {t:'l', gc:'1/6',  gr:'10/13',rot:0.9,  tx:0, ty:4},
  {t:'l', gc:'6/9',  gr:'10/13',rot:-1.3, tx:0, ty:-4},
  {t:'l', gc:'9/13', gr:'10/13',rot:0.8,  tx:0, ty:6}
];
function layoutFor(n){
  if(n>=10) return LAYOUT_10;
  return LAYOUT_9.slice(0,n);
}

/* ================= Util ================= */
const $  = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n=>String(n).padStart(2,'0');

/* Coba muat gambar; bila nama tidak ketemu, coba ekstensi lain (jpg, JPG, JPEG, png) */
function candidates(name){
  const base=name.replace(/\.[^.]+$/,'');
  const list=[name,base+'.jpg',base+'.JPG',base+'.jpeg',base+'.JPEG',base+'.png',base+'.PNG',base+'.webp'];
  return list.filter((v,i)=>list.indexOf(v)===i);
}
function tryLoad(src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>res({ok:true,src,w:im.naturalWidth,h:im.naturalHeight});
    im.onerror=()=>res({ok:false});
    im.src=src;
  });
}
async function probe(name){
  for(const src of candidates(name)){
    const r=await tryLoad(src);
    if(r.ok) return {name,src:r.src,w:r.w,h:r.h,ok:true};
  }
  return {name,ok:false};
}

/* ================= Bangun halaman ================= */
function build(){
  /* Navigasi & tombol hero dibuat otomatis dari daftar SESSIONS */
  $('#navLinks').innerHTML=SESSIONS.map(s=>'<a href="#sesi'+s.id+'">Sesi '+s.id+'</a>').join('');
  $('#cta').innerHTML=SESSIONS.map((s,i)=>
    '<a class="btn '+(i===0?'primary':'ghost')+'" href="#sesi'+s.id+'">Lihat Sesi '+s.id+'</a>').join('');

  const main=$('#main'); main.innerHTML='';
  SESSIONS.forEach(s=>{
    s.layout=layoutFor(s.images.length);
    const sec=document.createElement('section');
    sec.className='session '+s.cls; sec.id='sesi'+s.id;
    sec.innerHTML=
      '<div class="shead">'+
        '<div class="big">'+pad(s.id)+'</div>'+
        '<div class="ttlwrap"><div class="kicker">Sesi '+s.id+' · '+esc(s.label)+'</div>'+
          '<h2 class="ttl">'+esc(s.title)+'</h2><div class="per">'+esc(s.period)+'</div></div>'+
        '<div class="cnt"><b>'+s.images.length+'</b> foto</div>'+
      '</div>'+
      '<div class="collage"></div>';
    const grid=$('.collage',sec);
    s.layout.forEach((L,i)=>{
      const el=document.createElement('div');
      el.className='slot '+L.t; el.dataset.s=s.id; el.dataset.i=i;
      el.style.cssText='--gc:'+L.gc+';--gr:'+L.gr+';--rot:'+L.rot+'deg;--tx:'+(L.tx||0)+'px;--ty:'+(L.ty||0)+'px;--d:'+(i*70)+'ms';
      el.innerHTML='<div class="in-box">Memuat…</div>';
      grid.appendChild(el);
    });
    main.appendChild(sec);
  });
  const total=SESSIONS.reduce((a,s)=>a+s.images.length,0);
  $('#stats').innerHTML=SESSIONS.map(s=>
    '<div class="stat"><small>Sesi '+s.id+' · '+esc(s.label)+'</small><strong>'+s.images.length+'<span> foto</span></strong></div>').join('')+
    '<div class="stat"><small>Total Foto</small><strong>'+total+'<span> foto</span></strong></div>';
}

/* Cocokkan foto ke bingkai berdasarkan orientasi */
function assign(s,results){
  const ok=results.map((r,idx)=>({...r,idx})).filter(r=>r.ok);
  const P=ok.filter(r=>r.h>r.w), Ls=ok.filter(r=>r.h<=r.w);
  const place=new Array(s.layout.length).fill(null);
  s.layout.forEach((L,i)=>{ const q=L.t==='p'?P:Ls; if(q.length) place[i]=q.shift(); });
  const rest=[...P,...Ls].sort((a,b)=>a.idx-b.idx);          // sisa foto isi bingkai yang masih kosong
  place.forEach((v,i)=>{ if(!v && rest.length) place[i]=rest.shift(); });
  return place;
}

function renderSlot(s,i,r){
  const el=$('.slot[data-s="'+s.id+'"][data-i="'+i+'"]');
  if(!r){
    el.classList.add('empty');
    el.innerHTML='<div class="in-box">Foto belum tersedia</div>';
    return;
  }
  el.classList.add('filled'); el.dataset.n=r.idx;
  el.innerHTML='<div class="in-box"><img alt="" draggable="false"></div><span class="num">Foto '+(r.idx+1)+'</span>';
  const img=$('img',el); img.src=r.src; img.alt=s.title+' — '+r.name;
}

async function load(){
  /* Semua sesi dimuat paralel agar Sesi 3 tidak menunggu sesi sebelumnya */
  await Promise.all(SESSIONS.map(async s=>{
    const results=await Promise.all(s.images.map(probe));
    s.results=results;
    const place=assign(s,results);
    s.placed=place;
    place.forEach((r,i)=>renderSlot(s,i,r));
    const missing=results.filter(r=>!r.ok).map(r=>r.name);
    if(missing.length){
      const n=document.createElement('div'); n.className='note';
      n.innerHTML='Foto berikut tidak ditemukan: <b>'+missing.map(esc).join(', ')+'</b>.<br>Pastikan file ada di folder yang sama dengan halaman ini dan namanya sama persis.';
      $('.shead',$('#sesi'+s.id)).after(n);
    }
  }));
}

/* ================= Lightbox ================= */
const lb=$('#lb'); let LB={s:null,list:[],pos:0};
function openLb(s,n){
  if(!s.results) return;
  LB.s=s; LB.list=s.results.map((r,idx)=>({...r,idx})).filter(r=>r.ok);
  LB.pos=Math.max(0,LB.list.findIndex(r=>r.idx===n));
  showLb(); lb.hidden=false; document.body.style.overflow='hidden';
}
function showLb(){
  const r=LB.list[LB.pos]; if(!r) return;
  $('#lbImg').src=r.src; $('#lbImg').alt=r.name;
  $('#lbCap').innerHTML='<b>'+esc(LB.s.title)+'</b>Foto '+(r.idx+1)+' · '+(LB.pos+1)+' dari '+LB.list.length;
  const dl=$('#lbDl'); dl.href=r.src; dl.download=r.name;
  const multi=LB.list.length>1; $('#lbPrev').style.display=$('#lbNext').style.display=multi?'':'none';
}
function stepLb(d){ if(LB.list.length<2) return; LB.pos=(LB.pos+d+LB.list.length)%LB.list.length; showLb(); }
function closeLb(){ lb.hidden=true; document.body.style.overflow=''; }
$('#main').addEventListener('click',e=>{
  const el=e.target.closest('.slot.filled'); if(!el) return;
  openLb(SESSIONS.find(s=>s.id===+el.dataset.s),+el.dataset.n);
});
$('#lbPrev').onclick=e=>{ e.stopPropagation(); stepLb(-1); };
$('#lbNext').onclick=e=>{ e.stopPropagation(); stepLb(1); };
$('#lbClose').onclick=closeLb;
lb.addEventListener('click',e=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown',e=>{
  if(lb.hidden) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') stepLb(-1);
  if(e.key==='ArrowRight') stepLb(1);
});
let tx0=null;
lb.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; },{passive:true});
lb.addEventListener('touchend',e=>{ if(tx0===null) return; const dx=e.changedTouches[0].clientX-tx0; if(Math.abs(dx)>50) stepLb(dx<0?1:-1); tx0=null; });

/* ================= Animasi muncul saat scroll ================= */
function observe(){
  const slots=$$('.slot');
  if(!('IntersectionObserver' in window)){ slots.forEach(s=>s.classList.add('in')); return; }
  const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  slots.forEach(s=>io.observe(s));
}

build(); observe(); load();

})();
</script>
